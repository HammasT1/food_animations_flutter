name: Release APK

# Two ways to cut a release:
#   1. Push a tag:            git tag v1.0.0 && git push origin v1.0.0
#   2. Run manually:          Actions ▸ "Release APK" ▸ Run workflow ▸ version = 1.0.0
#      (the workflow creates and pushes the v-prefixed tag for you)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tag.outputs.name }}" -m "Release ${{ steps.tag.outputs.name }}"
          git push origin "${{ steps.tag.outputs.name }}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          OUT=build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$OUT/app-release.apk"              "dist/food-animation-$TAG-universal.apk"
          cp "$OUT/app-arm64-v8a-release.apk"    "dist/food-animation-$TAG-arm64-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk"  "dist/food-animation-$TAG-armeabi-v7a.apk"
          cp "$OUT/app-x86_64-release.apk"       "dist/food-animation-$TAG-x86_64.apk"

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ steps.tag.outputs.name }}
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: dist/*.apk
