<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Food Animation: a motion-first recipe and ordering app built with Flutter">
  <defs>
    <clipPath id="card">
      <rect x="0" y="0" width="1280" height="340" rx="28"/>
    </clipPath>
    <radialGradient id="amber">
      <stop offset="0" stop-color="#FFC107" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFC107" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFC107" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orange">
      <stop offset="0" stop-color="#FF7043" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FF7043" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF7043" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet">
      <stop offset="0" stop-color="#7C4DFF" stop-opacity="0.50"/>
      <stop offset="0.5" stop-color="#7C4DFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green">
      <stop offset="0" stop-color="#AED742" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#AED742" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .title { font-family: 'DM Serif Display', Georgia, 'Times New Roman', serif; font-size: 92px; fill: #ffffff; letter-spacing: -1.5px; }
      .accent { font-style: italic; fill: #FFB74D; }
      .sub { font-family: Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 23px; fill: #ffffff; fill-opacity: 0.72; font-weight: 500; }
      .pill { font-family: Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; fill-opacity: 0.9; letter-spacing: 0.3px; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="#101520"/>

    <!-- drifting ambient light -->
    <circle cx="160" cy="40" r="300" fill="url(#amber)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 40; 0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="170" r="280" fill="url(#orange)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 50; 0 0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="400" r="320" fill="url(#violet)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 80 -40; 0 0" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="20" r="160" fill="url(#green)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -40 30; 0 0" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- rising steam wisps -->
    <g fill="#ffffff">
      <circle cx="1090" cy="300" r="7" opacity="0">
        <animate attributeName="cy" values="300;150" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.18;0" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1130" cy="300" r="10" opacity="0">
        <animate attributeName="cy" values="300;130" dur="6.5s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.14;0" dur="6.5s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1060" cy="300" r="5" opacity="0">
        <animate attributeName="cy" values="300;170" dur="4.5s" begin="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.2;0" dur="4.5s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- headline -->
    <g>
      <text x="640" y="142" text-anchor="middle" class="title">Food <tspan class="accent">Animation</tspan></text>
    </g>
    <g>
      <text x="640" y="190" text-anchor="middle" class="sub">A motion-first recipe &amp; ordering app built with Flutter</text>
    </g>

    <!-- glass feature pills -->
    <g>
      <g transform="translate(222 228)">
        <rect width="184" height="44" rx="22" fill="#182032" fill-opacity="0.55"/>
        <rect width="184" height="44" rx="22" fill="url(#sheen)" stroke="url(#edge)" stroke-width="1.2"/>
        <text x="92" y="28" text-anchor="middle" class="pill">Glassmorphism</text>
      </g>
      <g transform="translate(422 228)">
        <rect width="198" height="44" rx="22" fill="#182032" fill-opacity="0.55"/>
        <rect width="198" height="44" rx="22" fill="url(#sheen)" stroke="url(#edge)" stroke-width="1.2"/>
        <text x="99" y="28" text-anchor="middle" class="pill">Dish-tinted colour</text>
      </g>
      <g transform="translate(636 228)">
        <rect width="196" height="44" rx="22" fill="#182032" fill-opacity="0.55"/>
        <rect width="196" height="44" rx="22" fill="url(#sheen)" stroke="url(#edge)" stroke-width="1.2"/>
        <text x="98" y="28" text-anchor="middle" class="pill">Add-to-cart flight</text>
      </g>
      <g transform="translate(848 228)">
        <rect width="210" height="44" rx="22" fill="#182032" fill-opacity="0.55"/>
        <rect width="210" height="44" rx="22" fill="url(#sheen)" stroke="url(#edge)" stroke-width="1.2"/>
        <text x="105" y="28" text-anchor="middle" class="pill">Live order tracking</text>
      </g>
    </g>

    <!-- periodic light sweep across the card -->
    <rect x="-400" y="0" width="300" height="340" fill="url(#shine)" transform="skewX(-18)">
      <animate attributeName="x" values="-400;1700" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.6" y="0.6" width="1278.8" height="338.8" rx="28" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
</svg>
